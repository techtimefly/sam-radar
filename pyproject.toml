[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-radar"
version = "0.1.0"
description = "Self-hosted SAM.gov opportunity intelligence for small businesses and capture teams."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0", "pypdf>=5.0"]

[project.scripts]
sam-radar = "sam_radar.cli:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
